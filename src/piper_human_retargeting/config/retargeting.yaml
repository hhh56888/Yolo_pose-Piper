# ============================================================
# 人体手臂 -> Piper 机械臂 映射配置
# ============================================================
# 本文件是所有映射/滤波/安全参数的**唯一来源**，主程序零硬编码。
#
# ⚠️ 核心原则：**不做「人体角度 = 机械臂关节角」直接赋值**
#    人体与 Piper 的运动学结构不同（连杆长度、关节零位、关节顺序都不同），
#    直接赋值在物理上没有意义，且人体**绝对角度**受以下因素严重影响：
#        摄像头安装角度 / 人的站位高低远近 / 身高 / 初始手臂姿势
#    因此本方案：
#        1) 先做初始姿态标定，得到人体基准角 human_neutral
#        2) 只映射**相对角度** delta = human_angle - human_neutral
#        3) 用区间归一化公式映射到关节行程
#    这样上面那些因素都会被标定吸收掉。
#
# 调参顺序（务必按此顺序，否则会互相干扰）：
#   1. invert  ：方向对不对（人抬臂 -> 机械臂上抬）
#   2. human_min/max：人体动多大范围算「走完全程」
#   3. robot_min/max：机械臂在这两端分别停在哪个角度
#   4. offset  ：整体微调
# ============================================================

# ============================================================
# 映射公式说明（实现见 mapping.py::map_human_to_robot）
# ============================================================
#   delta = human_angle - human_neutral          # 相对标定姿态的角度差(度)
#   ratio = (delta - human_min) / (human_max - human_min)
#   ratio = clamp(ratio, 0, 1)                   # clamp=true 时
#   robot = robot_min + ratio * (robot_max - robot_min)
#   if invert: robot = robot_min + robot_max - robot
#   robot = robot + offset
#   robot = clamp(robot, 关节真实限位)            # 最后一道保险
#
# 关于 human_min/human_max 的含义：
#   它们是 **delta（相对角）** 的范围，不是人体绝对角度。
#   例：human_min=-60, human_max=+60 表示
#       「人相对标定姿势向下 60° ~ 向上 60°」对应机械臂走完全程。
#   为什么不直接用绝对角度？见文件顶部的说明。
#
# ★★ 硬约束：human 区间必须**相对 Δ=0 对称**（即 human_min = -human_max）
#    ★★ 且 robot 区间中点必须等于该关节的 neutral 值。
#
#    原因：标定姿势对应 Δ=0，此时应当让机械臂停在中立位姿。
#    若 human 区间不对称，Δ=0 会落在 ratio≠0.5，机械臂就会偏离中立位置。
#    实测踩过：human=[20,150] 的中点 85 ≠ 标定基准，导致 Δ=0 时
#    ratio=-0.15 被 clamp 到 0，关节直接跑到区间端点。
#    已用 test_mapping_anchored_on_initial_pose 固化这条约束。
# ============================================================

# ============================================================
# 重映射模式（V1.1 核心开关）
# ============================================================
#   legacy     上臂角 -> joint2、肘夹角 -> joint3（原方案）
#   task_space 人体 reach/elevation -> 机器人 X/Z -> J2+J3 联合求解（V1.1 新增）
#
# 两套实现**并存**，切换这个值即可 A/B 对比或快速回退。
# 默认 legacy：task_space 需要先用离线对比验证通过再启用。
retarget_mode: "legacy"

# ---------- 标定 ----------
calibration:
  capture_seconds: 2.0          # 保持姿势的采集时长 (s)
  require_arm_complete: true    # 标定时要求手臂三点完整
  min_samples: 8                # 最少有效样本
  sample_rate_hz: 30.0

# ---------- 人体侧 ----------
human:
  side: "right"                 # 目标手臂
  min_confidence: 0.4           # 关键点置信度门限（三点点名检查见 tracker）
  require_complete: true

# ---------- 手臂几何枢轴 ----------
#
# 决定「上臂角 / 前臂角」是相对哪个点量的：
#
#   pivot: "shoulder"  以**人体肩关键点**为枢轴（原始做法）
#          上臂角 = 肩→肘方向，前臂角 = 肘→腕方向
#
#   pivot: "anchor"    以**画面锚点**为枢轴（默认，anchor_x/y = 0.5/1.0 即底边中点）
#          上臂角 = 锚点→肘方向，前臂角 = 锚点→腕方向
#
# 为什么要改成 anchor（实机反馈：反向弯曲、反直觉）：
#   shoulder 模式下，角度是「肢体自身的朝向」，而显示端是镜像的。
#   人把手抬高时，镜像画面里手臂朝右上，原始坐标里却朝左上，
#   于是「角度变大」在观感上对应手臂往下 —— 映射到机械臂就是反向。
#
#   anchor 模式下角度变成「手相对画面中轴的方位」：
#       手举到画面中上方 -> 前臂角 ≈ +90°
#       手放低到画面下方 -> 前臂角 ≈ -90°
#   「越伸展、角度越大」是直接读出来的，不再绕一层肢体朝向。
#
# 附带好处：肩关键点不再参与上臂/前臂角，肩部遮挡或出画时
#           不会再把三个量一起带偏（肘夹角仍用三点计算，它是关节角）。
#
# 画面里会用品红十字标出这个枢轴点，并画出「锚点->肘 / 锚点->腕」两条参考线。
geometry:
  # 按用户要求暂不启用锚点模式，沿用人体肩关键点作枢轴。
  # （anchor 的实现与测试都保留着，需要时可切回来）
  pivot: "shoulder"
  anchor_x: 0.5                 # 归一化位置：0.5 = 画面水平中点
  anchor_y: 1.0                 # 1.0 = 画面底边

# ---------- 机械臂侧 ----------
robot:
  use_current_as_initial: true  # 启动时把当前实际位姿记为初始位姿
  initial_pose: [0.0, 0.6, -0.6, 0.0, 0.0, 0.0]   # 上面为 false 时使用

  # ⚠️ 几个必须成对的量，不要混淆：
  #   human_neutral   标定得到的人体基准角（相对角度零点）
  #   initial_pose    机械臂基准位姿（此处也是映射的绝对位置基准）
  #   两者必须对应同一时刻的「人-机」状态，否则映射零点错位。
  #
  # ⚠️ neutral 必须给双向运动留出行程，否则映射会单边饱和：
  #    例：joint2 限位 [0,3.14]，若 neutral=0.9，
  #    人一抬臂 joint2 减小 -> 撞下限被裁剪 -> 看起来「抬到某角度就不动了」。
  #    已用 test_neutral_leaves_headroom_both_directions 固化约束。
  neutral_joints: [0.0, 0.6, -0.6, 0.0, 0.0, 0.0]

  # J1 / J4 在 2D 阶段保持固定安全值（不参与映射）
  # 原因：2D 图像无法可靠观测这两个自由度
  #   J1 需要肩部水平方位的可靠估计（2D 下与人的站位耦合）
  #   J4 前臂旋前/旋后在 2D 投影里几乎不可观测
  #
  # ⚠️ joint5 / joint6 已从「固定」改为「受控」：
  #   它们由 hand.compute_hand_pose 给出的腕部姿态驱动，见下面的 hand 段。
  #   实测依据（TF 正运动学）：
  #     joint5 -> 末端指向在竖直平面内转 ±50°，末端位置几乎不动 = 纯 pitch
  #     joint6 -> 末端绕自身轴滚转 ±110°，末端位置几乎不动   = 纯 roll
  fixed_joints:
    joint1: 0.0
    joint4: 0.0

# ============================================================
# 映射表
# ============================================================
# 每条规则 = 一个人体测量量 -> 一个机械臂关节
#
# 可用的人体测量量（见 geometry/arm_geometry.py）：
#   upper_arm_angle_deg  上臂方向角（图像平面，向上为正，右为 0）
#   elbow_angle_deg      肘夹角（0=完全伸直，越大越弯）
#   forearm_angle_deg    前臂方向角
#
# 各关节真实转轴（用 TF 正运动学实测，非猜测）：
#   joint1 (0,0,+1)   joint2 (0,+1,0)   joint3 (0,+1,0)
#   joint4 (+0.99,+0.16,+0.02)          joint5 (0,+1,0)
#   joint6 (+0.98,+0.19,+0.03)
#   => J2/J3/J5 是同一竖直平面内的俯仰关节，正好对应 2D 阶段可控的三个自由度
#
# 各关节正向运动对腕部的影响（实测 d(腕角)/dq，向上为正）：
#   joint2: -33.7 °/rad   （正增量使腕下降 -> 主抬臂关节）
#   joint3: -10.8 °/rad   （正增量使前臂上抬）
#   joint5:  -2.7 °/rad   （量级小，主要影响末端姿态）
# ============================================================
mapping:

  # ---------------- 角度滤波是否作用于下发值 ----------------
  #
  # 三级滤波链的语义应当逐级收紧：
  #     关键点 -> [角度滤波] -> 角度差 -> 区间映射 -> [关节滤波] -> 下发
  #
  # 若此开关为 false，区间映射直接吃**未经角度滤波**的原始角，
  # 角度滤波器就只被写进 CSV、对真正下发的关节值毫无影响 ——
  # 三级滤波实际退化为两级，而且从日志上看不出来（两列都在动）。
  #
  # 实机实测（400 帧录像，TRACKING 约 165 帧，相邻帧抖动中位数）：
  #     下发给机械臂的关节指令抖动
  #         joint2  0.01980 -> 0.00430 rad  (-78%)
  #         joint3  0.02170 -> 0.00000 rad  (-100%)
  #         joint5  0.05080 -> 0.02950 rad  (-42%)
  #     关节行程（确认没有把真实运动一起滤掉）
  #         joint2  0.647 -> 0.716    joint3  1.194 -> 1.195
  #         joint5  1.291 -> 1.178
  #     即：抖动大幅下降，行程基本不变（joint2 甚至略有增加）。
  #
  # 之所以默认 true：上述证据表明它严格更好，且**不改变任何区间标定**
  # （human_min/max、robot_min/max、invert 全部不动），
  # 只改变「喂给映射的角度是原始的还是滤波过的」。
  # 要复现历史行为（映射吃原始角），改成 false 即可。
  use_filtered_angles: true

  # ---------------- 上臂方向 -> J2（肩部抬起/放下）----------------
  j2:
    enabled: true
    human: "upper_arm_angle_deg"
    joint: "joint2"
    # 人体相对角范围（度）：必须以 Δ=0 为中心（对称）
    human_min: -60.0
    human_max: 60.0
    # 机械臂行程（弧度）：中点必须 = neutral_joints 里的 joint2 = 0.6
    #   (0.6 - A) + (0.6 + A) 的中点恒为 0.6
    # 振幅 A 反映「人走完全程时机械臂动多少」：
    #   A=1.6 -> 人抬 60° 时 joint2 走 1.6 rad（约 92°）
    # joint2 真实限位 [0, 3.14]，0.6±1.6 = [-1.0, 2.2]
    #   下限 -1.0 会被限位裁到 0（表现为「抬到头就到顶」），
    #   这是 joint2 行程偏低的必然结果，如需更大范围请调 neutral 或缩小 A
    robot_min: -1.00
    robot_max: 2.20
    # 方向推导（依据实测 d(腕角)/dq2 = -33.7°/rad，腕角向上为正）：
    #   人上臂角增大 = 抬臂 -> 要求腕角**上升**（d(腕角) > 0）
    #   d(腕角) = -33.7 × Δq2，要为正则 Δq2 必须 < 0
    #   -> human_max 应对应较小的 q2（区间反向）-> invert = true
    # ---- 方向修正的两个层次，别混 ----
    #   sign   : 修正**人体测量量本身**。实机实测以肩点为枢轴时
    #            corr(手的高度, 前臂角) = +0.561，即
    #            **手往下移、角度反而变大**，方向是反的。
    #            取 -1 让「手抬高 = 数值变大」成立。
    #            （该相关性是构型相关的：取决于手臂相对肩点/相机的摆位，
    #              所以做成配置项，不写死。）
    #   invert : 修正**机械臂关节**该往哪转。
    sign: +1
    invert: true
    offset: 0.0
    clamp: true
    max_jump: 0.0        # 上臂角由肩/肘两点决定，未见假跳变，暂不限制

  # ---------------- 肘夹角 -> J3（肘部屈伸）----------------
  # 这是 2D 模式下最重要、最可靠的关节控制量
  j3:
    enabled: true
    human: "elbow_angle_deg"
    joint: "joint3"
    # 肘夹角 0=完全伸直，越大越弯。
    # 人自然站立时肘夹角约 90°，标定基准就在这附近。
    # 因此取 ±65°：人从「基本伸直(25°)」到「大幅弯曲(155°)」走完全程
    human_min: -65.0
    human_max: 65.0
    # robot_min/robot_max 的顺序决定方向：
    #   human_min(伸直) -> robot_min
    #   human_max(弯肘) -> robot_max
    # 实测 FK 结论：**q3 增大 -> 腕下降 = 弯肘**
    #   => 弯肘端(robot_max)必须是**较大**的值
    #
    # ⚠️ 必须 robot_min = neutral - A、robot_max = neutral + A（同一个 A），
    #    否则 Δ=0 的中点就不等于 neutral，启动即报错（已由 validate 强制）。
    #    也就是说「振幅」是双向相等的，不能只放大一边。
    #
    # 取值考虑（joint3 限位 [-2.967, 0]，neutral=-0.6）：
    #   伸直方向（q3 增大）最多到 0    -> 可用 0.6 rad
    #   弯曲方向（q3 减小）最多到 -2.967 -> 可用 2.367 rad
    #   因此 A 必须 <= 0.6，否则伸直端一动作就被限位裁掉。
    #   取 A = 0.6：区间 [-1.2, 0.0]，invert 置 true 后
    #     伸直(Δ=-65) -> q3 = 0.0   （完全伸直）
    #     中位(Δ=  0) -> q3 = -0.6  （= neutral，锚点成立）
    #     弯肘(Δ=+65) -> q3 = -1.2  （更弯）
    #   人弯 65° 对应 q3 走 0.6 rad（约 34°）—— 幅度不大；
    #   想要更大弯曲行程应把 neutral 往负方向调（如 -1.5），
    #   两侧可用行程变成 1.5 / 1.467，A 可放大到约 1.45。
    #
    # 为什么用 invert=true 而不是写逆序区间 [-1.2, 0.0]->[0.0,-1.2]：
    #   两者等价（有测试保证），但 invert 形式让「区间始终 robot_min<robot_max」
    #   这一约定得以保持，排查时不需要额外判断区间是否逆序。
    robot_min: -1.20
    robot_max: 0.00
    # 方向推导（依据实测 d(腕角)/dq3 = -10.8°/rad，腕角向上为正）：
    #   依据：FK 实测 q3 增大 -> 腕上升（见 test_mapping.py 的实测灵敏度表）
    #   人弯肘(Δ增大) -> 腕应下降 -> q3 必须减小
    #   -> human_max 应对应**较小**的 q3 -> invert = true
    sign: -1
    invert: true
    offset: 0.0
    clamp: true
    max_jump: 0.0        # 肘夹角同上

  # ---------------- 腕部俯仰 -> J5（腕 pitch）----------------
  # 由**手部姿态**驱动：手朝向相对前臂的夹角。
  # 实测依据（TF 正运动学）：joint5 让末端指向在竖直平面内转 ±50°，
  # 而末端位置几乎不动（x 0.108~0.125）—— 是纯 pitch 自由度。
  j5_wrist:
    enabled: true
    human: "wrist_pitch_deg"
    joint: "joint5"
    # ±90° 留足余量。教训：joint3 曾用 ±65° 区间配实测 209° 行程，
    # 结果全程饱和、关节钉死不动。宁可区间略宽也不要马上饱和。
    human_min: -90.0
    human_max: 90.0
    # joint5 限位 ±1.22；neutral=0.0 -> 振幅上限 1.22，取 1.00 留余量
    robot_min: -1.00
    robot_max: 1.00
    # 方向（**由操作者实测标定**，不要凭几何推导）：
    #   2026-09-29 实时识别测试：invert=true 时操作者反馈「手腕上翘/下压反了」，
    #   翻成 false 后确认正确。
    #   教训：人手侧的角度符号（手往上翘时 wrist_pitch_deg 到底变大还是变小）
    #   取决于相机站位与手的姿态，单目 2D 下无法可靠推导 ——
    #   与 task_space.sign_h 同一类问题，必须用实测标定并在配置里写明依据。
    sign: +1
    invert: false
    offset: 0.0
    clamp: true
    # 腕俯仰的假跳变实测可达 353°（关键点被误估到对侧、
    # 「手朝向-前臂朝向」跨 ±180°）。60° 足以挡住它而不误伤真实动作。
    max_jump: 60.0

  # ---------------- 拇指相对四指 -> J6（腕部旋转）----------------
  # 按用户定义：四指并拢指向镜头时，
  #   拇指偏到**小指侧** -> 末端相对初始状态**逆时针**转 90°
  #   拇指偏到**食指侧** -> 末端相对初始状态**顺时针**转 90°
  #
  # 为什么用 thumb_offset 而不是掌横轴朝向（palm_roll）：
  #   四指指向镜头时，掌横轴在图像里的**方向**几乎不变（透视缩短），
  #   但拇指会明显偏到某一侧 —— 此时拇指偏移才是可观测信号。
  #   palm_roll 仍保留在 CSV 里作为观测/排查量。
  j6_roll:
    enabled: true
    human: "thumb_offset"
    joint: "joint6"
    # 归一化量（除以掌宽）：±0.5 覆盖拇指从食指侧到小指侧的典型行程。
    # 实测若饱和会报「贴区间端」，届时按实际范围调整。
    human_min: -0.5
    human_max: 0.5
    # joint6 限位 ±2.094；neutral=0.0。
    # 用户要的是 ±90° = ±1.571 rad，取 1.50 略留余量。
    robot_min: -1.50
    robot_max: 1.50
    sign: +1
    # 方向待实机确认：先取 invert=true（拇指偏食指侧 -> 正向）。
    # 若实机看是反的，翻成 false 即可，无需改代码。
    invert: true
    offset: 0.0
    clamp: true

# ============================================================
# task_space 重映射（V1.1）
# ============================================================
# retarget_mode: "task_space" 时生效。
#
# 思路：不再做「一个人体角度 -> 一个机器人关节」，而是
#     人体 reach/elevation -> 机器人 (x, z) 目标 -> J2/J3 联合求解。
# 因为 Piper 的 J2/J3 本就耦合（joint2 同时抬高+前推、
# joint3 同时改肘弯+伸展），逐关节映射无法解开。
#
# 人体量定义（见 task_space.compute_human_task_state）：
#   reach     = |S-W| / (|S-E| + |E-W|)   伸出程度，≈1 表示手臂伸直
#   elevation = (S.y - W.y) / 臂长         抬高程度，正值=手在上方
#   两者都用「臂长」归一化，因此与人机距离、体型解耦。
task_space:
  # ============================================================
  # 2D Task-Space Retargeting（V1.1）
  # ============================================================
  # 目标：**人的手往哪走，机器人 TCP 就往哪走**。
  # 不再用肘角决定 joint3；q2/q3 只由 TCP 目标经数值 IK 联合求解。
  #
  # 本段只在 retarget_mode: task_space 时生效。legacy 模式完全不读这里，
  # 因此两种方案可以一行配置切换、互为回退。

  # ---- FK 链路 ----
  # 由 tools/build_fk_chain.py 从**实际加载的** URDF 生成，
  # 文件内记录了 URDF 的 md5 与 root/tip link（可审计）。
  # 生成命令：
  #   ros2 param get /robot_state_publisher robot_description > /tmp/rd.txt
  #   python3 tools/build_fk_chain.py /tmp/robot_description.urdf \
  #           piper_human_retargeting/data/fk_chain.json
  chain_path: "data/fk_chain.json"

  # ---- 轴关系（**必须按实际相机站位配置**）----
  # 单目 2D 下"图像水平"代表机器人哪个轴，取决于相机在人侧面还是正面，
  # 不能在算法里硬编码（任务书 §8）。
  #   侧视（推荐）：图像水平 ≈ 机器人前后 -> x；图像垂直 -> z
  #   正视        ：图像水平 ≈ 机器人左右 -> y（此时 x 方向几乎不可观测）
  horizontal_axis: "x"
  vertical_axis: "z"
  # ⚠️ sign_h 必须按**实际相机站位**标定，不能凭直觉填。
  #
  # 实测（2026-09-29 实时识别测试，正面机位，561 个 TRACKING 帧）：
  #     corr(肘角, human_u)       = +0.964   # 手臂伸直(肘角↓) 时 u 变负
  #     corr(肘角, TCP_x)         = +0.785   # 于是"手伸直 -> 机械臂后退"（操作者反馈"反了"）
  #     corr(reach, human_u)      = -0.957   # 投影变长 <=> u 下降
  # 原因：正面机位下 u 是**投影量**——手臂伸直时手腕的横向投影偏移变小，
  #       "手往前伸"在图像里表现为 u 下降。sign_h=+1 适用于**侧视**机位
  #       （图像水平 ≈ 机器人前后，手前伸 -> u 上升）。
  # 取 -1 后：手伸直/前伸(u↓) -> TCP x 增大（前伸）✅，收回(u↑) -> 后退 ✅。
  # 若把相机挪到人体侧面，则应改回 +1 并重新做一遍 §20 四动作验证。
  sign_h: -1.0
  sign_v: 1.0      # 人手抬高 -> TCP +z（正面/侧面机位都成立，实测 corr(v,TCP_z)=+0.55~+0.90）

  # ---- 人体归一化位移 -> TCP 位移 ----
  # 人体量 u/v 已用臂长归一化（|u| <= 1），所以 kx 的语义是
  # "手横移一个臂长，TCP 走多少米"。
  kx: 0.35
  kz: 0.35
  # 死区（归一化位移）。超出死区后**减去死区**再映射，保证输出连续。
  deadzone_u: 0.02
  deadzone_v: 0.02

  # ---- TCP 目标行程（base_link 坐标，米）----
  # 来源：tools/scan_workspace.py 用真实 IK 逐格验证后的**最大可达矩形**
  #       x ∈ [0.181, 0.486]  z ∈ [0.050, 0.516]
  #       这里再向内留 ~2cm 余量，避免目标压在可达域边界上。
  x_min: 0.20
  x_max: 0.47
  z_min: 0.07
  z_max: 0.50
  clamp: true

  # ---- IK（J2/J3 联合求解）----
  #   cost = wx*(x-x_t)^2 + wz*(z-z_t)^2
  #        + lambda_prev*||q-q_prev||^2 + lambda_neutral*||q-q_neutral||^2
  # ⚠️ 权重与"位置误差"同量纲可比：位置项是米²、正则项是弧度²。
  #    lambda_prev 取 0.35 会让 IK 为了贴着上一帧而拒绝走向目标
  #    （实测大面积不收敛）；0.02 量级才是"防跳解的轻微约束"。
  wx: 1.0
  wz: 1.0
  lambda_prev: 0.02
  lambda_neutral: 0.002
  max_iters: 20
  tol: 0.0001

  # IK 关节盒：必须 ⊂ safe ⊂ physical（三层限位由 limits.py 校验，
  # 越界会在启动时直接报错，而不是悄悄被下游裁剪）
  #   physical: joint2 [0.000, 3.140]  joint3 [-2.967, 0.000]
  #   safe    : joint2 [0.100, 3.040]  joint3 [-2.867, -0.100]  (两端留 0.10)
  q2_min: 0.25
  q2_max: 2.89
  q3_min: -2.72
  q3_max: -0.25
  limit_margin_rad: 0.10

  # ---- task-space 实验 neutral ----
  # 由 tools/scan_workspace.py 的评分搜索给出（工作区中心度 + 关节余量 +
  # 可操作度）：
  #   q2=1.504 q3=-0.990 -> TCP=(+0.340, +0.286)
  #   到 IK 盒余量 m2=(+1.254,+1.386) m3=(+1.727,+0.740)，sigma_min=0.1994
  # 旧 neutral（legacy 用）仍是 robot.neutral_joints = [0, 0.6, -0.6, 0, 0, 0]，
  # **保留不动**，便于 A/B 对比与随时回退。
  neutral_joints: [0.0, 1.504, -0.99, 0.0, 0.0, 0.0]

  # IK 单帧跳变告警门限（rad）：超过就写进状态行，便于发现跳解
  jump_warn_rad: 0.25

# ============================================================
# 方向驱动映射（可选，覆盖 joint2/joint3）
# ============================================================
#
# 动机（实机反馈）：
#   逐关节映射（上臂角->joint2、肘夹角->joint3）**不保证**机械臂朝人手臂的
#   方向伸出去。Piper 的 joint2/joint3 是耦合的：
#       joint2 同时抬高与前推末端
#       joint3 同时改肘弯与伸展
#   于是「人往前伸」在机械臂上可能变成「往上抬或原地收拢」。
#
# 做法：
#   取人体「肩->腕」方向角作主控量（用户要求「更注重腕部相对肩部的角度」），
#   用它反解机械臂的 joint2/joint3，使机械臂的臂方向**对齐**人的方向。
#
# 量测依据（实拍视频 arm_fwd_up.mp4，441 有效帧）：
#   人体方向角范围 [-11.9°, +29.5°]，中位 +1.9°，行程 41°
#   （3/4 侧后机位下，抬臂主要是朝向相机的运动，2D 投影被压缩）
#   机械臂方向可达 [-24.3°, +172.8°]，行程 197°（FK 表实测）
#   因此 gain≈1.8 可让人的 41° 映射到机械臂约 74°
arm_direction:
  # 已按用户要求回退：暂时停用方向驱动映射，
  # 恢复为逐关节映射（j2<-上臂角、j3<-肘夹角）。
  # 实现与测试都保留着，需要时改回 true 即可（但需一并恢复
  # retargeter/demo 里的方向量接线，见报告 8.14 的回退说明）。
  enabled: false
  # FK 表：由 tools 在仿真里扫描生成（joint2 x joint3 -> 方向/伸展）
  # 相对路径按 retargeting.yaml 所在目录解析
  table_path: "data/fk_table.json"

  # 标定姿势对应的机械臂方向角。
  # **由 FK 表实测查得**（neutral j2=0.6 j3=-0.6 -> dir=79.1°），不要凭直觉填。
  neutral_dir_deg: 79.1

  # 人机方向增益。1.0 = 完全一致（最忠实但幅度偏小）
  gain: 1.8

  # 伸展量由「肘伸展度」决定：人手臂越直 -> 机械臂伸得越远
  reach_from_elbow: true
  elbow_straight_deg: 20.0      # 肘夹角小于此值视为完全伸直
  elbow_bent_deg: 140.0         # 大于此值视为完全弯曲
  reach_extended: 0.50          # 伸直时目标伸展 (m)，表内最大 0.537
  reach_folded: 0.20            # 弯曲时目标伸展 (m)，neutral 处约 0.194

# ============================================================
# 夹爪（joint7 / joint8）
# ============================================================
# 当前 V1：手部识别已可用（MediaPipe 21 点 + openness），
#          因此 mode 设为 "hand" 可跟随手掌开合。
#          若只想固定夹爪，把 mode 改成 "fixed"。
#
# 归一化：openness 0=握紧，1=完全张开
#   min_openness/max_openness 是**人体实际能达到的范围**，
#   用于把 [min,max] 拉伸到关节全行程，否则夹爪永远走不满。
# ============================================================
gripper:
  mode: "hand"                 # "fixed" | "hand"
  fixed_openness: 1.0          # mode=fixed 时使用
  joint7_open: 0.035           # 完全张开时 joint7 位置 (m)
  joint7_closed: 0.0           # 完全闭合时 joint7 位置 (m)
  min_openness: 0.15           # 人体 openness 下限（映射到全闭）
  max_openness: 0.85           # 人体 openness 上限（映射到全开）
  deadband_m: 0.0008           # 目标变化小于此值不更新（0.8mm）
  # 夹爪开合方向：joint7 增大=张开。若实机上反了，把下面改成 true
  invert: false

# ============================================================
# 安全
# ============================================================
safety:
  # ============================================================
  # 关于「关节速度限制」放在哪里
  # ============================================================
  # 本层**不做**单周期 delta 截断，原因：
  #   曾在这里加过 max_step_rad 粗限幅（位置在映射之后、关节滤波之前），
  #   结果是滤波器算出的值又被截断一次，
  #   最终输出由「alpha 与限幅谁先谁后」决定，
  #   调 alpha 的效果被限幅掩盖（实测：目标 1.55 却输出 0.7）。
  #
  #   正确的限速位置是 piper_human_control.safety.SafetyLimiter：
  #       dq_max = min(a_max * dt, v_max * dt)     # 每关节独立
  #       if |target - current| > dq_max: 按 dq_max 逼近
  #   它知道 dt、知道**实测**关节角，且每关节可配，
  #   比在这里用一个全局常数截断更准确、更安全。
  #
  #   限速参数见：piper_human_control/config/joint_limits.yaml
  #       velocity_limits     (rad/s)
  #       acceleration_limits (rad/s^2)
  # ============================================================

  go_neutral_on_start: true

  # ---- 丢失手臂时的行为 ----
  # true  = 平滑回初始位姿（默认）
  # false = 冻结最后目标（不执行 HOME，也不回位）
  #
  # ⚠️ 本项目**不会**因为检测失败而突然执行 HOME ——
  #    HOME 是一次大幅运动，在遥操作场景下反而危险。
  return_home_when_lost: true

  # 回位前的宽限时间 (s)。人手一晃、被身体挡一下都会造成单帧丢失，
  # 若立刻回位机械臂会一惊一乍。
  #
  # ⚠️ 回位必须覆盖**全部受控关节**（active_joint_names()）。
  #    曾经只遍历 controlled_joints()，而 task_space 模式下 joint2/joint3
  #    的 legacy 规则被停用、不在该集合里 —— 结果只有腕关节回位、
  #    大臂冻在原地，观感就是"识别不到时机械臂不动"（实测踩到，已修）。
  lost_grace_seconds: 1.0

  # 回位速度：每秒朝初始位姿推进的比例 (0,1]。
  # 0.6 约 1.7s 走完大部分行程 —— 平滑且不突兀。
  return_home_speed: 0.6

  # 重新识别到手臂后是否立即恢复映射
  resume_on_reacquire: true

# ============================================================
# 控制循环
# ============================================================
control:
  # 控制频率 (Hz)。
  # ⚠️ 显式限频是必要的：若不限频，控制周期由推理耗时决定，
  #    YOLO 首帧 1.1s 或偶发卡顿会直接表现为控制周期拉长。
  #    虽然有 SafetyLimiter 的 dt 夹紧保护，
  #    但「控制频率不确定」本身不该出现在实时遥操作里。
  control_hz: 30.0

  # 超过此耗时的帧视为「控制周期超时」，计入统计并在 HUD 上显示
  overrun_warn_ms: 100.0

# ============================================================
# 调试
# ============================================================
debug:
  # CSV 记录（raw / filtered 对比，便于分析滤波延迟与映射效果）
  csv_enabled: false
  csv_path: "/tmp/piper_teleop_log.csv"
  csv_every_n_frames: 1        # 每 N 帧记录一行（1=每帧）

  # HUD 上显示 raw / filtered 对比
  show_raw_filtered: true

  # 每 N 帧打印一次行统计（0=不打印）
  stats_every_n_frames: 60
